[project]
name = "ec-graph"
version = "0.1.0"
description = "Hybrid Retrieval and GraphRAG based e-commerce knowledge-enhanced QA system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "neo4j>=5.20",
    "pydantic>=2.7",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
rag = [
    "langchain-core>=0.2",
    "langchain-deepseek>=0.1",
    "langchain-huggingface>=0.1",
    "langchain-neo4j>=0.1",
    "neo4j-graphrag>=1.7",
]
ml = [
    "datasets>=2.19",
    "evaluate>=0.4",
    "seqeval>=1.2",
    "torch>=2.3",
    "transformers>=4.41",
]
dev = [
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
